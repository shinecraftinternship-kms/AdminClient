# System Scanner Pro admin - nginx reverse proxy
# Place in /etc/nginx/sites-available/scanner.conf, symlink into sites-enabled.
# Replace scanner.example.com with the real domain. UDP port 45000 (discovery)
# is handled directly by the app and must be open in the firewall.

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name scanner.example.com;

    client_max_body_size 20m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name scanner.example.com;

    ssl_certificate     /etc/letsencrypt/live/scanner.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scanner.example.com/privkey.pem;

    client_max_body_size 20m;

    # Forward client IPs / scheme so Django sees the real client
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # REST / dashboard
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # WebSocket (real-time dashboard, live commands) - requires upgrade headers
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 86400;
    }

    # Static files (optional: served by Django/whitenoise by default)
    location /static/ {
        alias /opt/scanner-admin/admin/static/;
    }
}
