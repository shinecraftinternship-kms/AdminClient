name: Register with Supabase

on:
  schedule:
    - cron: '0 * * * *'  # Run hourly
  workflow_dispatch:  # Allow manual trigger

jobs:
  supabase-register:
    name: Register Vercel URL in Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Register with Supabase (direct REST API)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VERCEL_URL: https://admin-client-weld.vercel.app
        run: |
          # Extract hostname from Vercel URL
          HOSTNAME=$(echo "$VERCEL_URL" | sed 's|https://||; s|/.*||')
          
          curl -X POST "${SUPABASE_URL}/rest/v1/server_registry" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            -d "{
              \"id\": \"admin\",
              \"ip_address\": \"$HOSTNAME\",
              \"port\": 443,
              \"protocol\": \"https\",
              \"is_active\": true,
              \"updated_at\": \"now()\"
            }" \
            --fail --silent --show-error --max-time 30
          
          echo "Registered $HOSTNAME in Supabase"