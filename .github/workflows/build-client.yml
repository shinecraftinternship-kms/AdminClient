name: Build Client Binaries

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "build_client.py"
      - ".github/workflows/build-client.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller psutil requests websockets watchdog netifaces

      - name: Build binary
        run: python build_client.py

      # Commit each platform's binary into admin/data so the admin panel's
      # /download-client/ endpoint serves every OS automatically (the Vercel
      # deployment ships files straight from the repo).
      - name: Commit binaries for download endpoint
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add admin/data/
          if git diff --cached --quiet; then
            echo "No binary changes to commit"
          else
            git commit -m "build: refresh ${{ matrix.platform }} client binary [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: client_scanner-${{ matrix.platform }}
          path: |
            dist/client_scanner*
            dist/system-scanner*.deb
            admin/data/client_scanner*
            admin/data/system-scanner*.deb
          if-no-files-found: error
